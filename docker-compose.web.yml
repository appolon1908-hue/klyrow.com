services:
  gateway:
    environment:
      KLYROW_PUBLIC_URL: https://app.klyrow.com
      KLYROW_OIDC_ISSUER: https://auth.codestra.co/realms/codestra
      KLYROW_OIDC_CLIENT_ID: klyrow-portal
      KLYROW_OIDC_REDIRECT_URI: https://app.klyrow.com/auth/callback

  web:
    image: '${KLYROW_WEB_IMAGE:?set the exact protected web image by digest}'
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:18004:8080"
    networks: [frontend]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 20s
      timeout: 5s
      retries: 5

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:18004:8080"
    networks: [frontend]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 20s
      timeout: 5s
      retries: 5

name: Klyrow gateway CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: klyrow_ci
          POSTGRES_USER: klyrow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klyrow -d klyrow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/gateway/requirements.txt
      - name: Install gateway and test dependencies
        run: pip install -r apps/gateway/requirements.txt pytest pip-audit
      - name: Audit Python dependencies
        run: pip-audit --requirement apps/gateway/requirements.txt
      - name: Apply migrations twice and verify the ledger
        env:
          KLYROW_DATABASE_URL: postgresql+psycopg://klyrow:ci-only-password@127.0.0.1:5432/klyrow_ci
        run: |
          python scripts/migrate
          python scripts/migrate
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["KLYROW_DATABASE_URL"]).connect() as connection:
              count = connection.execute(text("SELECT count(*) FROM klyrow_schema_migrations")).scalar_one()
              expected = sum(1 for _ in __import__("pathlib").Path("migrations").glob("*.sql"))
              assert count == expected, (count, expected)
          PY
      - name: Compile and test
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q apps/gateway
          pytest -q tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [frontend, test, secrets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Bind reproducible build epoch to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build backend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: klyrow-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build migration candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          load: true
          tags: klyrow-migrate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build Postal provisioner candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postal-provisioner.Dockerfile
          load: true
          tags: klyrow-postal-provisioner:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build frontend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: klyrow-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify composed browser edge and canonical callback
        env:
          EDGE_NETWORK: klyrow-auth-edge-ci
          GATEWAY_IMAGE: klyrow-gateway:${{ github.sha }}
          WEB_IMAGE: klyrow-web:${{ github.sha }}
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f klyrow-web-edge-ci klyrow-gateway-edge-ci >/dev/null 2>&1 || true
            docker network rm "$EDGE_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$EDGE_NETWORK"
          docker run --rm -d \
            --network "$EDGE_NETWORK" \
            --network-alias gateway \
            --name klyrow-gateway-edge-ci \
            --tmpfs /tmp \
            --env KLYROW_ENV=development \
            --env KLYROW_DATABASE_URL=sqlite:////tmp/klyrow-edge.db \
            --env KLYROW_SESSION_SECRET=klyrow-auth-edge-ci-session-secret-2026 \
            --env KLYROW_SAFE_MODE=true \
            --env KLYROW_EMBEDDED_WORKERS=false \
            --env LIVE_EMAIL_DELIVERY=false \
            --env EXTERNAL_EMAIL_DELIVERY=false \
            --env PRODUCTION_PROVIDER_ROUTING=false \
            --env KLYROW_PUBLIC_URL=https://app.klyrow.com \
            --env KLYROW_OIDC_REDIRECT_URI=https://app.klyrow.com/auth/callback \
            "$GATEWAY_IMAGE"
          docker run --rm -d \
            --network "$EDGE_NETWORK" \
            --name klyrow-web-edge-ci \
            --publish 127.0.0.1:18014:8080 \
            "$WEB_IMAGE"

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null \
              --header "Host: app.klyrow.com" \
              http://127.0.0.1:18014/auth/session; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          KLYROW_EDGE_BASE_URL=http://127.0.0.1:18014 scripts/verify-browser-edge

      - name: Scan backend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-gateway:${{ github.sha }}
          format: sarif
          output: trivy-gateway.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-web:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan migration candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-migrate:${{ github.sha }}
          format: sarif
          output: trivy-migrate.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Postal provisioner candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-postal-provisioner:${{ github.sha }}
          format: sarif
          output: trivy-postal-provisioner.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Retain Trivy scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ github.sha }}
          path: |
            trivy-gateway.sarif
            trivy-web.sarif
            trivy-migrate.sarif
            trivy-postal-provisioner.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Generate backend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-gateway:${{ github.sha }}
          format: cyclonedx-json
          output-file: klyrow-gateway-${{ github.sha }}.cdx.json
          upload-artifact: true

      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-web:${{ github.sha }}
          format: cyclonedx-json
          output-file: klyrow-web-${{ github.sha }}.cdx.json
          upload-artifact: true

      - name: Generate migration CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-migrate:${{ github.sha }}
          format: cyclonedx-json
          output-file: klyrow-migrate-${{ github.sha }}.cdx.json
          upload-artifact: true

      - name: Generate Postal provisioner CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-postal-provisioner:${{ github.sha }}
          format: cyclonedx-json
          output-file: klyrow-postal-provisioner-${{ github.sha }}.cdx.json
          upload-artifact: true

      - name: Verify reproducible OCI image bytes
        run: |
          set -euo pipefail
          declare -A dockerfiles=(
            [gateway]="apps/gateway/Dockerfile"
            [web]="apps/web/Dockerfile"
            [migrate]="docker/migrate.Dockerfile"
            [postal-provisioner]="docker/postal-provisioner.Dockerfile"
          )
          for image in gateway web migrate postal-provisioner; do
            dockerfile="${dockerfiles[$image]}"
            for copy in a b; do
              docker buildx build \
                --no-cache \
                --provenance=false \
                --sbom=false \
                --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
                --output "type=oci,dest=${RUNNER_TEMP}/klyrow-${image}-${copy}.tar,rewrite-timestamp=true" \
                --file "${dockerfile}" \
                .
            done
            cmp \
              "${RUNNER_TEMP}/klyrow-${image}-a.tar" \
              "${RUNNER_TEMP}/klyrow-${image}-b.tar"
            sha256sum "${RUNNER_TEMP}/klyrow-${image}-a.tar"
          done

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Bind reproducible build epoch to source commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - id: push_gateway
        name: Publish backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: apps/gateway/Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-gateway:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: push_web
        name: Publish frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: apps/web/Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-web:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: push_migrate
        name: Publish migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: docker/migrate.Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-migrate:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: push_postal_provisioner
        name: Publish Postal provisioner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: docker/postal-provisioner.Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-postal-provisioner:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest backend digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/klyrow-gateway
          subject-digest: ${{ steps.push_gateway.outputs.digest }}
          push-to-registry: true

      - name: Attest frontend digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/klyrow-web
          subject-digest: ${{ steps.push_web.outputs.digest }}
          push-to-registry: true

      - name: Attest migration digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/klyrow-migrate
          subject-digest: ${{ steps.push_migrate.outputs.digest }}
          push-to-registry: true

      - name: Attest Postal provisioner digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/klyrow-postal-provisioner
          subject-digest: ${{ steps.push_postal_provisioner.outputs.digest }}
          push-to-registry: true

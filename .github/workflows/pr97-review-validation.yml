name: Isolated PR97 review validation

on:
  push:
    branches: [repair/pr97-review-validation-20260906]

permissions:
  contents: read

concurrency:
  group: isolated-pr97-review-20260906
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'appolon1908-hue/klyrow.com' && github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: klyrow_ci
          POSTGRES_USER: klyrow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klyrow -d klyrow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_HEAD: 39b860269d860427e83e2c53805ec42aaf392883
      BASE_TREE: 464d120878d1177257046c1242b090be09e3d222
      EXPECTED_TREE: 66aac9c8cf02e8cd8a26e89bfd2b4515d56406a0
      RESULT_BRANCH: repair/pr97-reviewed-results-20260906
      KLYROW_SAFE_MODE: 'true'
      LIVE_EMAIL_DELIVERY: 'false'
      EXTERNAL_EMAIL_DELIVERY: 'false'
      PRODUCTION_PROVIDER_ROUTING: 'false'
      KLYROW_SECURITY_SMTP_ENABLED: 'false'
      KLYROW_SECURITY_SMTP_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checksummed patch and exact candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('repair/pr97-review.patch.gz.b64').read_text().strip()
          assert len(encoded) == 6768
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 16086
          assert hashlib.sha256(patch).hexdigest() == 'c0b3635fe8ba61a2a0e3be65bae3d2ce7f35b96ac8b826068ad83845b3425f30'
          Path(os.environ['RUNNER_TEMP'], 'review.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          git apply --index --check "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          bash -n scripts/generate-env
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact repository dependencies
        shell: bash
        run: python -m pip install -r apps/gateway/requirements.txt pytest openapi-spec-validator
      - name: Run complete isolated repository suite
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          python -m compileall -q apps/gateway
          python -m pytest -q tests
      - name: Verify PostgreSQL transactions and result-query behavior
        shell: bash
        env:
          PYTHONPATH: .
          KLYROW_CONTRACT_POSTGRES_URL: postgresql+psycopg://klyrow:ci-only-password@127.0.0.1:5432/klyrow_ci
        run: python -m pytest -q tests/test_middleware_email_contract.py tests/test_durable_operation_results.py
      - name: Publish only a new non-production evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --check
          test -z "$(git ls-remote origin "refs/heads/$RESULT_BRANCH")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(review): preserve key authority and bound operation result queries'
          test "$(git rev-parse HEAD^1)" = "$BASE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          printf 'RESULT_SHA=%s\nRESULT_TREE=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_TREE"
          echo 'PROTECTED_MAIN_CHANGED=NO'
          echo 'PR_HEAD_CHANGED=NO'
          echo 'PRODUCTION_CHANGED=NO'
          echo 'LIVE_EMAIL_DELIVERY=DISABLED'

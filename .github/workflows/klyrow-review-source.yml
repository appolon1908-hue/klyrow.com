name: Isolated review correction rehearsal
on:
  push:
    branches: [workbench/klyrow-issues-20260907]
    paths: [.github/workflows/klyrow-review-source.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bcb8aa968e8c8244071214d4293c2ca1ae2ce2ed
          path: transport
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 415aac98d7fec9ecdf5c618d85a8043c86c28ab5
          path: source
      - name: Verify and apply exact reviewed bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = Path('../transport/.workbench/pr100-review-fixes.patch.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0c70afb77423c2ad4d0a7e79a54f3b34eb38f353c5e46bce7be2d54bff140145'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git add scripts/migrate-mautic-volumes tests/test_mautic_volume_migration.py docs/runtime/MAUTIC_DATA_MIGRATION.md
          git diff --cached --check
          test "$(git write-tree)" = ef19e9d96e2b576fdc569ccd9b049f0df18eb63d
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest cryptography==50.0.0
      - name: Real root copy and nested-bind-mount regression rehearsal
        env:
          REHEARSAL_BASE: /tmp/klyrow-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$REHEARSAL_BASE"
          sudo env KLYROW_MAUTIC_MOUNT_REHEARSAL=1 \
            "$(command -v python)" -m pytest -q tests/test_mautic_volume_migration.py \
            --basetemp "$REHEARSAL_BASE"
      - name: Publish verified correction to an isolated transfer branch
        run: |
          set -euo pipefail
          test "$(git write-tree)" = ef19e9d96e2b576fdc569ccd9b049f0df18eb63d
          git diff --exit-code
          target=workbench/pr100-verified-repairs-20260907
          test -z "$(git ls-remote origin "refs/heads/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mautic): bound file reads and enforce descriptor mount identity'
          git push origin "HEAD:refs/heads/$target"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

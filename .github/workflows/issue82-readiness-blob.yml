name: Issue 82 exact readiness blob
on:
  push:
    branches: [repair/issue82-readiness-blob-20260907]
    paths: [.github/workflows/issue82-readiness-blob.yml]
permissions:
  contents: write
jobs:
  blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 75b304c434cd20e77ad60c80977763326d393d16
          persist-credentials: false
      - name: Publish one hash-verified source blob, not refs or runtime
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('redirect refused')
          def git_blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != '75b304c434cd20e77ad60c80977763326d393d16':
              raise SystemExit('source mismatch')
          raw=pathlib.Path('apps/gateway/app/main.py').read_bytes()
          if git_blob(raw) != '5ea7a4982fb0901292ed5ca122149c8bde0d15b9':
              raise SystemExit('original blob mismatch')
          old=b'def readyz(s:Session=Depends(db)):s.execute(select(1));return {"status":"ready","safe_mode":SAFE_MODE}\n'
          new=b'def readyz(s:Session=Depends(db)):\n    s.execute(select(1))\n    if not keyring_ready():raise HTTPException(503,"durable_result_keys_unavailable")\n    return {"status":"ready","safe_mode":SAFE_MODE}\n'
          if raw.count(old) != 1:
              raise SystemExit('patch context mismatch')
          result=raw.replace(old,new)
          expected='25dd0b3c46d809612a5fc36c24c450c9e5241ae3'
          if git_blob(result) != expected:
              raise SystemExit('candidate blob mismatch')
          data=json.dumps({'content':base64.b64encode(result).decode('ascii'),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/appolon1908-hue/klyrow.com/git/blobs',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_OBJECT_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
              recorded=json.load(response)
          if recorded.get('sha') != expected:
              raise SystemExit('published blob mismatch')
          print('READINESS_SOURCE_BLOB='+expected)
          PY

name: Isolated Klyrow issue workbench
on:
  push:
    branches: [workbench/klyrow-issues-20260907]
    paths: [.github/workflows/klyrow-issue-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 215adf292397f5f2872d36fbb50d88f7551eaeac
          persist-credentials: false
      - name: Export transport for exact-byte verification
        run: |
          mkdir -p "$RUNNER_TEMP/transport"
          cp .workbench/integration-authority.patch.gz.b64 "$RUNNER_TEMP/transport/patch.b64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patch-transport-verification
          path: ${{ runner.temp }}/transport/
          retention-days: 1
          if-no-files-found: error

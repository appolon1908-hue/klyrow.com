name: Isolated issue82 durable-result validation

on:
  push:
    branches: [repair/issue82-durable-validation-20260906]

permissions:
  contents: read

concurrency:
  group: isolated-klyrow-issue82-durable-results-20260906
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'appolon1908-hue/klyrow.com' && github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: klyrow_ci
          POSTGRES_USER: klyrow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klyrow -d klyrow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_MAIN: d67c96505328bd2bae266bbfab7ed525c40166c0
      BASE_TREE: a38134bd34fd2ad878fd47f2aa75ae0d28b6e56b
      EXPECTED_TREE: 18f24fe458eabad5708e83affc80d64f1a9db05f
      RESULT_BRANCH: fix/issue82-durable-results-20260906
      KLYROW_SAFE_MODE: 'true'
      LIVE_EMAIL_DELIVERY: 'false'
      EXTERNAL_EMAIL_DELIVERY: 'false'
      PRODUCTION_PROVIDER_ROUTING: 'false'
      KLYROW_SECURITY_SMTP_ENABLED: 'false'
      KLYROW_SECURITY_SMTP_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decode checksummed transport and verify exact source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'repair/issue82-durable.patch.gz.b64.part{i}').read_text().strip() for i in range(1, 9))
          assert len(encoded) == 27936, len(encoded)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 79069
          assert hashlib.sha256(patch).hexdigest() == '6136b53b0791de2db4267eb7873878290a8a666601c5133372d4bb3076787900'
          Path(os.environ['RUNNER_TEMP'], 'durable.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          git apply --index --check "$RUNNER_TEMP/durable.patch"
          git apply --index "$RUNNER_TEMP/durable.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 19
          git diff --cached --stat
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install repository dependency versions
        shell: bash
        run: python -m pip install -r apps/gateway/requirements.txt pytest openapi-spec-validator
      - name: Run complete isolated repository suite
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          python -m compileall -q apps/gateway scripts/rewrap-durable-results
          python -m pytest -q tests
      - name: Run real PostgreSQL transaction and cancellation invariants
        shell: bash
        env:
          PYTHONPATH: .
          KLYROW_CONTRACT_POSTGRES_URL: postgresql+psycopg://klyrow:ci-only-password@127.0.0.1:5432/klyrow_ci
        run: python -m pytest -q tests/test_middleware_email_contract.py tests/test_durable_operation_results.py
      - name: Publish only the validated feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_MAIN"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --check
          test -z "$(git ls-remote origin "refs/heads/$RESULT_BRANCH")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(operations): encrypt durable results and fence stale Mautic attempts'
          test "$(git rev-parse HEAD^1)" = "$BASE_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          printf 'RESULT_SHA=%s\nRESULT_TREE=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_TREE"
          echo 'PROTECTED_MAIN_CHANGED=NO'
          echo 'PRODUCTION_CHANGED=NO'
          echo 'LIVE_EMAIL_DELIVERY=DISABLED'

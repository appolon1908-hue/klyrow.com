name: Codestra deploy readiness

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

# klyrow.com is public and cannot call the private infrastructure repository's
# reusable workflow. Keep the repository-owned gate read-only; image release is
# governed separately by the protected-main publish job in ci.yml.
permissions:
  contents: read

concurrency:
  group: klyrow-deploy-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-ci:
    name: deploy-readiness / source-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Validate non-mutating staging contracts
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 pytest==8.4.2
          python -m pytest -q tests/test_staging_environment_contract.py
          bash -n scripts/staging-preflight scripts/staging-deploy
          docker compose --env-file deploy/staging/staging.env.example \
            -f deploy/staging/compose.yml config --quiet

name: Mautic offline data rehearsal

on:
  pull_request:
    paths:
      - scripts/migrate-mautic-volumes
      - tests/test_mautic_volume_migration.py
      - docs/runtime/MAUTIC_DATA_MIGRATION.md
      - .github/workflows/mautic-data-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest cryptography==50.0.0
      - name: Verify read-only mount, encrypted migration, replay and restore
        env:
          REHEARSAL_BASE: /tmp/klyrow-mautic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -x /usr/bin/gpg
          test ! -e "$REHEARSAL_BASE"
          sudo env KLYROW_MAUTIC_MOUNT_REHEARSAL=1 \
            "$(command -v python)" -m pytest -q \
            tests/test_mautic_volume_migration.py \
            --basetemp "$REHEARSAL_BASE"

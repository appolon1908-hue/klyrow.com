title = "Klyrow secret scanning policy"

[extend]
useDefault = true

# Gitleaks Action is pinned to 8.24.3, whose global allowlist syntax is the
# singular table. Keep exact value-only exceptions for public upstream PHP
# signing-key fingerprints and the synthetic browser invitation fixture.
[allowlist]
description = "Reviewed public fingerprints and synthetic test fixture"
regexes = [
  '''^1198C0117593497A5EC5C199286AF1F9897469DC$''',
  '''^C28D937575603EB4ABB725861C0779DC5C0A9DE4$''',
  '''^AFD8691FDAEDF03BDF6E460563F15A9B715376CA$''',
  '''^invite_capability_0123456789abcdef$''',
]

limit_req_zone $binary_remote_addr zone=klyrow_api:10m rate=10r/s;
server {
  listen 80; server_name klyrow.com www.klyrow.com app.klyrow.com api.klyrow.com track.klyrow.com;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2; server_name app.klyrow.com;
  ssl_certificate /etc/letsencrypt/live/app.klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.klyrow.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://127.0.0.1:18000; include proxy_params; }
  location /mautic/ { proxy_pass http://127.0.0.1:18001/; include proxy_params; proxy_set_header X-Forwarded-Prefix /mautic; }
  location /ops/ { proxy_pass http://127.0.0.1:18003/; include proxy_params; }
}
server {
  listen 443 ssl http2; server_name api.klyrow.com track.klyrow.com;
  ssl_certificate /etc/letsencrypt/live/api.klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.klyrow.com/privkey.pem;
  location / { limit_req zone=klyrow_api burst=30 nodelay; proxy_pass http://127.0.0.1:18000; include proxy_params; }
}

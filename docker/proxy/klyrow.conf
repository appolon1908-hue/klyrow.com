limit_req_zone $binary_remote_addr zone=klyrow_api:10m rate=10r/s;
server {
  server_name klyrow.com www.klyrow.com app.klyrow.com api.klyrow.com track.klyrow.com bounce.klyrow.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / {
    limit_req zone=klyrow_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:18000;
    include proxy_params;
  }
  location /mautic/ { proxy_pass http://127.0.0.1:18001/; include proxy_params; }
  location /ops/ { proxy_pass http://127.0.0.1:18003/; include proxy_params; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot





}

server {
    if ($host = bounce.klyrow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = track.klyrow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = api.klyrow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = app.klyrow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = klyrow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name klyrow.com www.klyrow.com app.klyrow.com api.klyrow.com track.klyrow.com bounce.klyrow.com;
    return 404; # managed by Certbot










}
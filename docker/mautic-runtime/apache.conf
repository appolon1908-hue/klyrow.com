# Writable media never controls Apache policy or executes uploaded PHP.
<Directory /var/www/html/docroot/media/files>
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html/docroot/media/images>
    AllowOverride None
    Options -Indexes -ExecCGI
    SetHandler default-handler
    php_admin_flag engine Off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

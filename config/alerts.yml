groups:
- name: klyrow-mail-engine
  rules:
  - alert: KlyrowGatewayUnavailable
    expr: up{job="klyrow"} == 0
    for: 2m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow provider gateway unavailable
      description: Klyrow provider gateway unavailable. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowMailDeadLetter
    expr: klyrow_provider_queue_messages{status="DEAD_LETTER"} > 0
    for: 5m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow mail entered dead letter
      description: Klyrow mail entered dead letter. Inspect the provider metrics and
        event ledger using the runbook; verify recovery before replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowEventDeliveryStalled
    expr: klyrow_provider_events{state=~"RETRY|DEAD_LETTER"} > 0
    for: 10m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow provider events are not reaching Server A
      description: Klyrow provider events are not reaching Server A. Inspect the provider
        metrics and event ledger using the runbook; verify recovery before replaying
        queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowUsageDeliveryStalled
    expr: klyrow_provider_usage_events{state=~"RETRY|DEAD_LETTER"} > 0
    for: 10m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow usage events are not reaching its billing control plane
      description: Klyrow usage events are not reaching its billing control plane.
        Inspect the provider metrics and event ledger using the runbook; verify recovery
        before replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowHostDiskPressure
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
      < 0.15
    for: 10m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow host disk space below 15 percent
      description: Klyrow host disk space below 15 percent. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowEmailQueueStalled
    expr: klyrow_email_outbox_oldest_seconds > 300
    for: 5m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Oldest Klyrow email outbox item exceeds five minutes
      description: Oldest Klyrow email outbox item exceeds five minutes. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowN8nDeliveryStalled
    expr: sum(klyrow_integration_outbox_items{target="N8N",state=~"RETRY|DEAD_LETTER"})
      > 0
    for: 10m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow events are not reaching n8n
      description: Klyrow events are not reaching n8n. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowOdooDeliveryStalled
    expr: sum(klyrow_integration_outbox_items{target="ODOO",state=~"RETRY|DEAD_LETTER"})
      > 0
    for: 10m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow synchronization is not reaching Odoo
      description: Klyrow synchronization is not reaching Odoo. Inspect the provider
        metrics and event ledger using the runbook; verify recovery before replaying
        queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowCustomerWebhookFailures
    expr: sum(klyrow_webhook_attempts{state=~"RETRY|DEAD_LETTER"}) > 0
    for: 10m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Customer webhook delivery is failing
      description: Customer webhook delivery is failing. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowHighBounceRate
    expr: klyrow_delivery_ratio{outcome="bounced"} > 0.05
    for: 15m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow aggregate bounce rate exceeds five percent
      description: Klyrow aggregate bounce rate exceeds five percent. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowHighComplaintRate
    expr: klyrow_delivery_ratio{outcome="complained"} > 0.002
    for: 15m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow aggregate complaint rate exceeds 0.2 percent
      description: Klyrow aggregate complaint rate exceeds 0.2 percent. Inspect the
        provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowDomainDnsInvalid
    expr: klyrow_domain_dns_invalid > 0
    for: 30m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: One or more Klyrow domains are not verified for sending
      description: One or more Klyrow domains are not verified for sending. Inspect
        the provider metrics and event ledger using the runbook; verify recovery before
        replaying queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowBillingReconciliationFailure
    expr: klyrow_billing_reconciliation_drift > 0
    for: 10m
    labels:
      severity: critical
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow billing ledger reconciliation found drift
      description: Klyrow billing ledger reconciliation found drift. Inspect the provider
        metrics and event ledger using the runbook; verify recovery before replaying
        queued work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowHostCpuPressure
    expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
    for: 15m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow host CPU exceeds 90 percent
      description: Klyrow host CPU exceeds 90 percent. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md
  - alert: KlyrowHostMemoryPressure
    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
    for: 15m
    labels:
      severity: warning
      environment: production
      service: klyrow
      codestra_business: klyrow
      owner: appolon1908-hue
    annotations:
      summary: Klyrow host memory exceeds 90 percent
      description: Klyrow host memory exceeds 90 percent. Inspect the provider metrics
        and event ledger using the runbook; verify recovery before replaying queued
        work.
      runbook_url: https://github.com/appolon1908-hue/klyrow.com/blob/main/docs/ALERT_ROUTING.md

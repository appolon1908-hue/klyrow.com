global:
  scrape_interval: 15s
  external_labels:
    environment: production
    service: klyrow
    codestra_business: klyrow
    owner: appolon1908-hue
    prometheus: klyrow-provider
    host: 37.27.128.39
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: klyrow
  authorization:
    credentials_file: /run/secrets/klyrow_metrics_token
  static_configs:
  - targets:
    - gateway:8000
- job_name: host
  static_configs:
  - targets:
    - node-exporter:9100
alerting:
  alertmanagers:
  - scheme: https
    api_version: v2
    timeout: 10s
    tls_config:
      ca_file: /run/secrets/alertmanager_ca
      cert_file: /run/secrets/alertmanager_client_cert
      key_file: /run/secrets/alertmanager_client_key
      server_name: alertmanager.core.codestra.internal
      insecure_skip_verify: false
    static_configs:
    - targets:
      - 10.40.0.1:19093

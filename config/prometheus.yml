global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: klyrow
    authorization:
      credentials_file: /run/secrets/klyrow_metrics_token
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: host
    static_configs: [{targets: ["node-exporter:9100"]}]

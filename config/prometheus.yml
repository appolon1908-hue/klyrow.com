global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: klyrow
    authorization:
      credentials_file: /run/secrets/klyrow_metrics_token
    static_configs: [{targets: ["172.23.0.20:8000"]}]
  - job_name: host
    static_configs: [{targets: ["node-exporter:9100"]}]

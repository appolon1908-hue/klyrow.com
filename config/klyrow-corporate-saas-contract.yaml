      - enterprise_group_mappings
      - scim_tokens
      - directory_objects
      - provisioning_events
    requirements:
      - keycloak_remains_authority
      - saml_and_oidc_customer_connections
      - domain_enforced_sso
      - jit_provisioning
      - scim_users_groups
      - deprovision_revokes_sessions

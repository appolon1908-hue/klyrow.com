<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Klyrow</title><style>body{font:16px system-ui;background:#08111f;color:#eaf2ff;margin:0}.wrap{max-width:1200px;margin:auto;padding:32px}header{display:flex;justify-content:space-between}.card{background:#101e33;border:1px solid #263b59;border-radius:14px;padding:20px;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #426086;background:#091524;color:white;margin:4px}button{background:#5b7cfa;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.muted{color:#9cb0ca}pre{white-space:pre-wrap;max-height:260px;overflow:auto}</style></head><body><div class="wrap"><header><h1>Klyrow</h1><button onclick="logout()">Log out</button></header><div id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><button onclick="forgot()">Forgot password</button><p id="msg"></p></div><main id="dash" hidden><p class="muted">Tenant-isolated email operations</p><div class="grid"><section class="card"><h2>Account & usage</h2><pre id="account"></pre><pre id="usage"></pre></section><section class="card"><h2>API keys</h2><input id="keyname" placeholder="Key name"><button onclick="key()">Create</button><pre id="keyout"></pre></section><section class="card"><h2>Sending domains</h2><input id="domain" placeholder="example.com"><button onclick="addDomain()">Add</button><pre id="domains"></pre></section><section class="card"><h2>Contacts</h2><input id="contactemail" placeholder="person@example.com"><input id="contactname" placeholder="Name"><button onclick="contact()">Add/update</button><pre id="contacts"></pre></section><section class="card"><h2>Campaigns</h2><input id="campaignname" placeholder="Campaign name"><input id="campaignsubject" placeholder="Subject"><button onclick="campaign()">Create mock</button><pre id="campaigns"></pre></section><section class="card"><h2>Compliance</h2><button onclick="refresh()">Refresh</button><pre id="suppressions"></pre></section><section id="admin" class="card" hidden><h2>Platform administration</h2><p>Customers, suspension, quotas, domain approval, abuse and health.</p><pre id="tenants"></pre></section></div></main></div><script>let t=sessionStorage.token||'';async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+t,'Content-Type':'application/json'};let r=await fetch(p,o),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.detail||r.status);return x}async function login(){try{let x=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value}),headers:{}});t=x.access_token;sessionStorage.token=t;show()}catch(e){msg.textContent=e}}function logout(){sessionStorage.clear();location.reload()}async function forgot(){await fetch('/v1/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});msg.textContent='If the account exists, instructions will be sent.'}async function refresh(){let me=await api('/v1/me');account.textContent=JSON.stringify(me,null,2);usage.textContent=JSON.stringify(await api('/v1/usage'),null,2);domains.textContent=JSON.stringify(await api('/v1/domains'),null,2);contacts.textContent=JSON.stringify(await api('/v1/contacts'),null,2);campaigns.textContent=JSON.stringify(await api('/v1/campaigns'),null,2);suppressions.textContent=JSON.stringify(await api('/v1/suppressions'),null,2);if(me.role==='platform_admin'){admin.hidden=false;tenants.textContent=JSON.stringify(await api('/v1/admin/tenants'),null,2)}}async function show(){login.hidden=true;dash.hidden=false;await refresh()}async function key(){keyout.textContent=JSON.stringify(await api('/v1/api-keys',{method:'POST',body:JSON.stringify({name:keyname.value})}),null,2)}async function addDomain(){await api('/v1/domains',{method:'POST',body:JSON.stringify({domain:domain.value})});refresh()}async function contact(){await api('/v1/contacts',{method:'POST',body:JSON.stringify({email:contactemail.value,name:contactname.value})});refresh()}async function campaign(){await api('/v1/campaigns',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({name:campaignname.value,subject:campaignsubject.value})});refresh()}if(t)show().catch(logout)</script></body></html>

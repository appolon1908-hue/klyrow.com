map $http_x_forwarded_proto $klyrow_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_request_id $klyrow_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Re-resolve the gateway after a rolling container replacement. Without the
# shared upstream zone and `resolve`, Nginx retains the gateway address that
# existed only at web-container startup.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream klyrow_gateway_dynamic {
    zone klyrow_gateway_dynamic 64k;
    server gateway:8000 resolve;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"klyrow-web"}';
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 421;
    }
}

server {
    listen 8080;
    server_name app.klyrow.com;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"klyrow-web"}';
    }

    location ^~ /auth-assets/ {
        alias /usr/share/nginx/html/;
        expires 1y;
        # Any add_header in a location replaces inherited add_header values.
        # Repeat the security set so immutable assets retain the same policy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Request-ID $klyrow_request_id always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /auth/ {
        proxy_pass http://klyrow_gateway_dynamic;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $klyrow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $klyrow_request_id;
        proxy_redirect off;
    }

    location ^~ /app/api/ {
        proxy_pass http://klyrow_gateway_dynamic;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $klyrow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $klyrow_request_id;
        proxy_redirect off;
    }

    location ^~ /v1/ {
        proxy_pass http://klyrow_gateway_dynamic;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $klyrow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $klyrow_request_id;
        proxy_redirect off;
    }

    location = /metrics {
        proxy_pass http://klyrow_gateway_dynamic;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $klyrow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $klyrow_request_id;
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Request-ID $klyrow_request_id always;
        add_header Cache-Control "no-store" always;
    }
}

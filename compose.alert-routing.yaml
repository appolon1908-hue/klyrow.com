# Include in the protected Compose checksum and release evidence before use.
services:
  prometheus:
    networks: [backend, alertmanager_egress]
    volumes:
      - ${KLYROW_PROMETHEUS_ROUTED_CONFIG:?set the validated rendered configuration}:/etc/prometheus/prometheus.yml:ro
      - ${KLYROW_ALERTMANAGER_CA_FILE:?set the trusted Alertmanager CA}:/run/secrets/alertmanager-ca.crt:ro
      - ${KLYROW_ALERTMANAGER_CLIENT_CERT_FILE:?set the Klyrow monitoring client certificate}:/run/secrets/alertmanager-client.crt:ro
      - ${KLYROW_ALERTMANAGER_CLIENT_KEY_FILE:?set the protected Klyrow monitoring client key}:/run/secrets/alertmanager-client.key:ro
networks:
  # Separate from the internal application network; no inbound port is published.
  alertmanager_egress:
    driver: bridge
    internal: false

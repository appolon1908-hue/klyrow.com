name: klyrow

services:
  smtp-relay:
    env_file:
      - ${KLYROW_ENV_FILE:-.env}
    environment:
      KLYROW_SECURITY_SMTP_ENABLED: "${KLYROW_SECURITY_SMTP_ENABLED:-false}"
      KLYROW_SECURITY_SMTP_LIVE_ENABLED: "${KLYROW_SECURITY_SMTP_LIVE_ENABLED:-false}"
      KLYROW_SECURITY_SMTP_PRODUCTION_APPROVED: "${KLYROW_SECURITY_SMTP_PRODUCTION_APPROVED:-false}"
      KLYROW_SECURITY_SMTP_CANARY_RECIPIENTS: "${KLYROW_SECURITY_SMTP_CANARY_RECIPIENTS:-}"
      KLYROW_SECURITY_SMTP_CANARY_MAX_DELIVERIES: "${KLYROW_SECURITY_SMTP_CANARY_MAX_DELIVERIES:-1}"

  worker:
    environment:
      KLYROW_SECURITY_SMTP_ENABLED: "${KLYROW_SECURITY_SMTP_ENABLED:-false}"
      KLYROW_SECURITY_SMTP_LIVE_ENABLED: "${KLYROW_SECURITY_SMTP_LIVE_ENABLED:-false}"
      KLYROW_SECURITY_SMTP_PRODUCTION_APPROVED: "${KLYROW_SECURITY_SMTP_PRODUCTION_APPROVED:-false}"
      KLYROW_SECURITY_SMTP_CANARY_RECIPIENTS: "${KLYROW_SECURITY_SMTP_CANARY_RECIPIENTS:-}"
      KLYROW_SECURITY_SMTP_CANARY_MAX_DELIVERIES: "${KLYROW_SECURITY_SMTP_CANARY_MAX_DELIVERIES:-1}"
      KLYROW_SECURITY_SMTP_EXPECTED_MODE: "${KLYROW_SECURITY_SMTP_EXPECTED_MODE:-disabled}"
      KLYROW_SECURITY_SMTP_TENANT_ID: "${KLYROW_SECURITY_SMTP_TENANT_ID:-}"
      KLYROW_SECURITY_SMTP_USERNAME: "${KLYROW_SECURITY_SMTP_USERNAME:-}"
      KLYROW_SECURITY_SMTP_SENDER: "${KLYROW_SECURITY_SMTP_SENDER:-}"
